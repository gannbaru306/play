<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>周波数分析</title>
</head>
<body>
  <h2>音声ファイル 周波数分析 (CQT)</h2>
  <input type="file" id="fileInput" accept=".wav,.mp3" />
  <button id="analyzeBtn">解析開始</button>
  <pre id="debug" style="background:#eee; padding:10px; height:220px; overflow:auto;"></pre>

  <script>
    // Hann窓
    function hann(N) {
      const w = new Float32Array(N);
      for (let n = 0; n < N; n++) {
        w[n] = 0.5 * (1 - Math.cos(2 * Math.PI * n / (N - 1)));
      }
      return w;
    }

    // CQTカーネル生成
    function makeCQTKernel(sr, fmin, bins, binsPerOctave) {
      const Q = 1 / (Math.pow(2, 1 / binsPerOctave) - 1);
      const kernels = [];
      for (let k = 0; k < bins; k++) {
        const fk = fmin * Math.pow(2, k / binsPerOctave);
        const Nk = Math.max(16, Math.round(Q * sr / fk)); // 下限確保
        const window = hann(Nk);
        const winRe = new Float32Array(Nk);
        const winIm = new Float32Array(Nk);
        for (let n = 0; n < Nk; n++) {
          const phase = -2 * Math.PI * fk * n / sr;
          const amp = window[n]; // /Nk は外す
          winRe[n] = amp * Math.cos(phase);
          winIm[n] = amp * Math.sin(phase);
        }
        kernels.push({ winRe, winIm, length: Nk });
      }
      return kernels;
    }

    // CQT本体（軽量化版）
    function cqtRaw(samples, sr, hopLength, bins=64, binsPerOctave=12, fmin=55.0, debugCallback=null) {
      const kernels = makeCQTKernel(sr, fmin, bins, binsPerOctave);
      const maxLen = Math.max(...kernels.map(k => k.length));
      const totalFrames = Math.max(0, Math.floor((samples.length - maxLen) / hopLength));
      const frames = [];

      for (let frameIndex = 0, start = 0;
           start + maxLen < samples.length;
           start += hopLength, frameIndex++) {

        const frame = new Float32Array(bins);
        for (let k = 0; k < bins; k++) {
          const { winRe, winIm, length } = kernels[k];
          let re = 0, im = 0;
          for (let n = 0; n < length; n++) {
            const x = samples[start + n] || 0;
            re += x * winRe[n];
            im += x * winIm[n];
          }
          frame[k] = Math.sqrt(re*re + im*im);
        }
        frames.push(frame);

        // デバッグ出力（フレーム番号のみ）
        if (debugCallback) {
          debugCallback(frameIndex+1, totalFrames);
        }
      }

      // 全フレーム処理後に一度だけ globalMax を計算
      const globalMax = Math.max(...frames.flat());

      return { frames, globalMax };
    }

    // 0〜100に正規化
    function normalizeTo100(frames, globalMax, threshold=1e-6) {
      const out = [];
      const denom = globalMax > threshold ? globalMax : threshold;
      for (const frame of frames) {
        const line = Array.from(frame, v => {
          let norm = (v / denom) * 100;
          if (norm < 0.5) return 0;     // 小さい値はゼロ
          if (norm > 100) norm = 100;
          return Math.round(norm);
        }).join(", ");
        out.push(line);
      }
      return out.join("\r\n");
    }

    async function analyzeAudio(file) {
      const arrayBuffer = await file.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      const samples = audioBuffer.getChannelData(0);
      const sr = audioBuffer.sampleRate;
      const hopLength = Math.floor(sr / 60);

      const debugArea = document.getElementById("debug");
      debugArea.textContent = "解析開始...\n";

      const { frames, globalMax } = cqtRaw(
        samples, sr, hopLength, 64, 12, 55.0,
        (frameIndex, totalFrames) => {
          const msg = `フレーム ${frameIndex}/${totalFrames} 処理中...`;
          console.log(msg);
          debugArea.textContent += msg + "\n";
        }
      );

      const outputText = normalizeTo100(frames, globalMax);

      // ダウンロードリンク生成
      const blob = new Blob([outputText], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "output.txt";
      link.textContent = "結果をダウンロード";
      link.style.display = "block";
      link.style.marginTop = "10px";
      document.body.appendChild(link);

      debugArea.textContent += `\n解析完了！ globalMax=${globalMax.toFixed(6)} を基準に 0〜100 に正規化`;
    }

    document.getElementById("analyzeBtn").addEventListener("click", () => {
      const file = document.getElementById("fileInput").files[0];
      if (file) analyzeAudio(file);
    });
  </script>
</body>
</html>
