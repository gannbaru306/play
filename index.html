<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>CQT トレース出力（ブラウザ完結）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, "Helvetica Neue", Arial; padding: 16px; background:#fafafa; color:#111; }
    #debug { background:#111; color:#bcd; padding:10px; height:240px; overflow:auto; white-space:pre-wrap; }
    button { padding:8px 12px; margin-left:8px; }
    .note { font-size:0.9rem; color:#555; margin-top:6px; }
    a.download { display:block; margin-top:12px; }
  </style>
</head>
<body>
  <h2>CQT 周波数分析（librosa.cqt トレース）</h2>

  <input id="fileInput" type="file" accept=".wav,.mp3,audio/*" />
  <button id="analyzeBtn">解析開始</button>
  <div class="note">出力形式：フレーム優先（frame0の全bins → frame1の全bins …）、改行は CRLF(\r\n)、小数点3桁。</div>
  <pre id="debug">待機中。音声ファイルを選択して「解析開始」を押してください。</pre>

<script>
/* ----------- ヘルパー ----------- */
// Hann窓
function hann(N) {
  const w = new Float32Array(N);
  if (N === 1) { w[0] = 1; return w; }
  for (let n = 0; n < N; n++) {
    w[n] = 0.5 * (1 - Math.cos(2 * Math.PI * n / (N - 1)));
  }
  return w;
}
// L2ノルム
function l2norm(arr) {
  let s = 0;
  for (let i = 0; i < arr.length; i++) s += arr[i] * arr[i];
  return Math.sqrt(s) || 1;
}
// 小数点3桁に丸め（文字列）
function fmt3(v) {
  return Number(v).toFixed(3);
}

/* ----------- CQT カーネル生成（librosa風に近づける） ----------- */
function makeCQTKernel(sr, fmin, nBins, binsPerOctave) {
  // Qファクタ（librosaと同じ式）
  const Q = 1 / (Math.pow(2, 1 / binsPerOctave) - 1);
  const kernels = new Array(nBins);
  let maxLen = 0;
  for (let k = 0; k < nBins; k++) {
    const fk = fmin * Math.pow(2, k / binsPerOctave);
    // NkはQ * sr / fk（ceiling）
    let Nk = Math.max(2, Math.ceil(Q * sr / fk));
    // Pythonのlibrosaは最低長の扱いやFFTベースの実装が入るがここでは直積分型の窓を作る
    const window = hann(Nk);
    const norm = l2norm(window); // L2正規化（窓のエネルギーで割る）
    const winRe = new Float32Array(Nk);
    const winIm = new Float32Array(Nk);
    for (let n = 0; n < Nk; n++) {
      const phase = -2 * Math.PI * fk * n / sr;
      const w = window[n] / norm;
      winRe[n] = w * Math.cos(phase);
      winIm[n] = w * Math.sin(phase);
    }
    kernels[k] = { winRe, winIm, length: Nk, fk };
    if (Nk > maxLen) maxLen = Nk;
  }
  return { kernels, maxLen };
}

/* ----------- CQT 本体（フレームごとに少しずつ処理、UIブロック回避） ----------- */
async function computeCQTAndDownload(samples, sr, hopLength, nBins=256, binsPerOctave=32, fmin=32.703) {
  const debug = document.getElementById('debug');
  debug.textContent = "カーネル生成中...\n";
  const { kernels, maxLen } = makeCQTKernel(sr, fmin, nBins, binsPerOctave);
  debug.textContent += `カーネル生成完了（max kernel length=${maxLen}）\n`;

  // フレーム数（Pythonでの floor((len(samples)-maxLen)/hop_length) と等価に）
  const totalFrames = Math.max(0, Math.floor((samples.length - maxLen) / hopLength) + 1);
  debug.textContent += `サンプル長: ${samples.length}, hopLength: ${hopLength}, 総フレーム: ${totalFrames}\n`;

  // 出力を文字列でためていく（メモリ注意：長い音声は大きくなる）
  const outLines = [];
  let processedFrames = 0;

  // チャンク単位でUIを更新しつつ処理（重い処理を一度にやらない）
  const CHUNK = 4; // 一度に処理するフレーム数（必要に応じて増減して）
  for (let frameIndex = 0; frameIndex < totalFrames; frameIndex += CHUNK) {
    const endFrame = Math.min(totalFrames, frameIndex + CHUNK);
    for (let fi = frameIndex; fi < endFrame; fi++) {
      const start = fi * hopLength;
      // 各binに対して畳み込み（内積）
      for (let k = 0; k < nBins; k++) {
        const { winRe, winIm, length } = kernels[k];
        let re = 0.0, im = 0.0;
        // 単純な内積（zero-padは samples[start+n] || 0 を使う）
        for (let n = 0; n < length; n++) {
          const x = samples[start + n] || 0.0;
          re += x * winRe[n];
          im += x * winIm[n];
        }
        const mag = Math.sqrt(re*re + im*im);
        // Pythonの処理に合わせ /5000 のスケール
        const scaled = mag / 5000.0;
        outLines.push(fmt3(scaled));
      }
      processedFrames++;
    }
    // 進行ログ更新
    debug.textContent = `処理中… フレーム ${processedFrames}/${totalFrames}\n`;
    // 少し待ってUIを更新（ブラウザの応答維持）
    await new Promise(resolve => setTimeout(resolve, 0));
  }

  debug.textContent = `処理完了：${processedFrames}フレーム（${nBins} bins） → 総値数=${outLines.length}\n`;
  // 改行は CRLF（\r\n）にする（Pythonと同じ）
  const text = outLines.join("\r\n");

  // ダウンロードリンクを作る
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const existing = document.querySelector('a.download');
  if (existing) existing.remove();
  const a = document.createElement('a');
  a.href = url;
  a.download = 'output.txt';
  a.textContent = '結果をダウンロード (output.txt)';
  a.className = 'download';
  document.body.appendChild(a);

  debug.textContent += "ダウンロードリンクを生成しました。\n";
  return true;
}

/* ----------- 実行部分 ----------- */
document.getElementById('analyzeBtn').addEventListener('click', async () => {
  const debug = document.getElementById('debug');
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files && fileInput.files[0];
  if (!file) {
    alert("音声ファイルを選択してください。");
    return;
  }
  debug.textContent = "解析開始...\n";

  try {
    // AudioContext はユーザー操作後に生成（互換性確保）
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    const arrayBuffer = await file.arrayBuffer();
    // decodeAudioData: ブラウザ互換のため Promise 形式で呼ぶ
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
    // 1chにする（mixdown）
    let samples = audioBuffer.getChannelData(0);
    // もしステレオなら左チャンネルのみを使用する。mixdownが必要なら次のようにする
    if (audioBuffer.numberOfChannels > 1) {
      // シンプルミックス（左を使うだけにして高速化）
      // （※必要なら平均化でmixdownに変更できる）
    }
    const sr = audioBuffer.sampleRate;
    const hopLength = Math.max(1, Math.floor(sr / 60)); // Pythonと同じ sr//60
    debug.textContent += `サンプルレート: ${sr} Hz, hopLength: ${hopLength}\n`;

    // 実行（n_bins=256, bins_per_octave=32, fmin=C1=32.703）
    await computeCQTAndDownload(samples, sr, hopLength, 256, 32, 32.703);

  } catch (err) {
    console.error(err);
    debug.textContent += `エラー: ${err && err.message ? err.message : String(err)}\n`;
    alert("解析中にエラーが発生しました。コンソールを確認してください（GitHub Pages上でF12が使えない場合は別ブラウザで試すと良いです）。");
  }
});
</script>
</body>
</html>
